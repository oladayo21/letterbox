openapi: 3.0.3
info:
  title: Letterbox API
  description: IMAP-to-REST facade with webhook support
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - apiKey: []

paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      summary: Readiness check
      security: []
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /accounts:
    get:
      summary: List accounts
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Validation error or IMAP connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get account
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete account
      responses:
        '204':
          description: Account deleted
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{id}/folders:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List IMAP folders
      responses:
        '200':
          description: List of folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: IMAP error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{id}/folders/{name}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: before
        in: query
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        schema:
          type: string
          format: date-time
    get:
      summary: List messages in folder
      responses:
        '200':
          description: Paginated message list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{id}/messages/{uid}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: uid
        in: path
        required: true
        schema:
          type: integer
      - name: folder
        in: query
        schema:
          type: string
          default: INBOX
    get:
      summary: Get message by UID
      responses:
        '200':
          description: Full message with attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: IMAP error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks:
    get:
      summary: List webhooks
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
    post:
      summary: Create webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Validation error or account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete webhook
      responses:
        '204':
          description: Webhook deleted
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /search:
    get:
      summary: Full-text search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: folder
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        checks:
          type: object
          properties:
            database:
              type: string
            s3:
              type: string

    EmailAddress:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required:
        - email

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        imap_host:
          type: string
        imap_port:
          type: integer
        imap_user:
          type: string
        smtp_host:
          type: string
        smtp_port:
          type: integer
        smtp_user:
          type: string
        created_at:
          type: string
          format: date-time

    CreateAccountRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        imap_host:
          type: string
          maxLength: 255
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
        imap_user:
          type: string
          maxLength: 255
        imap_password:
          type: string
        smtp_host:
          type: string
          maxLength: 255
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
        smtp_user:
          type: string
          maxLength: 255
        smtp_password:
          type: string
      required:
        - name
        - imap_host
        - imap_port
        - imap_user
        - imap_password

    Folder:
      type: object
      properties:
        name:
          type: string
        message_count:
          type: integer

    MessageListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uid:
          type: integer
        message_id:
          type: string
        folder:
          type: string
        subject:
          type: string
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        date:
          type: string
          format: date-time
        flags:
          type: array
          items:
            type: string

    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageListItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
        url:
          type: string
          format: uri

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uid:
          type: integer
        message_id:
          type: string
        folder:
          type: string
        subject:
          type: string
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        cc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        date:
          type: string
          format: date-time
        parsed:
          type: object
          properties:
            text:
              type: string
            html:
              type: string
        raw:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        flags:
          type: array
          items:
            type: string

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          maxLength: 2048
        secret:
          type: string
          minLength: 16
          maxLength: 256
      required:
        - account_id
        - url
        - secret
